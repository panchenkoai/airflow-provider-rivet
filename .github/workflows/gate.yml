name: Live gate

# The live Airflow gate (python -m gate) against a released rivet binary: on demand, and before a provider release.
# rivet's own release gate runs the same scenario against its candidate build (dev/release_oracle/airflow_provider.py).

on:
  workflow_dispatch:
    inputs:
      rivet:
        description: "rivet release tag (default: the latest release)"
        required: false
  push:
    tags: ["airflow-v*"]

permissions:
  contents: read

jobs:
  gate:
    name: Airflow 2.10.5 and 3.3.2 on rivet ${{ inputs.rivet || 'latest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: uv
      - name: Download the rivet Linux binary
        env:
          GH_TOKEN: ${{ github.token }}
        # The image is Debian 12 (glibc 2.36): the plain `-linux-gnu` asset needs glibc 2.38+ and cannot start there.
        # A release from 0.32 on carries a `-glibc2.28` asset; an older one is taken from its Debian ghcr.io image.
        run: |
          tag="${{ inputs.rivet }}"
          [ -n "$tag" ] || tag=$(gh release view -R panchenkoai/rivet --json tagName -q .tagName)
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          asset="rivet-$tag-x86_64-unknown-linux-gnu-glibc2.28.tar.gz"
          if gh release view "$tag" -R panchenkoai/rivet --json assets -q '.assets[].name' | grep -qxF "$asset"; then
            gh release download "$tag" -R panchenkoai/rivet -p "$asset" -D rivet-dl
            tar -xzf "rivet-dl/$asset" -C rivet-dl
            find rivet-dl -type f -name rivet -exec cp {} ./rivet-bin \;
          else
            docker create --name rivet-src --platform linux/amd64 "ghcr.io/panchenkoai/rivet:$tag"
            docker cp rivet-src:/usr/local/bin/rivet ./rivet-bin
            docker rm rivet-src
          fi
          chmod +x rivet-bin
      - run: uv run --only-group gate python -m gate --rivet-bin ./rivet-bin --verdicts verdicts.jsonl
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-verdicts
          path: verdicts.jsonl
          if-no-files-found: ignore
